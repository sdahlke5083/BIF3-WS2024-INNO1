name: Build, Package & Release on Tag

on:
  push:
    tags:
      - "v*"       # Build only on tags starting with 'v' (semantic versioning)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: false
        default: ""

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PLUGIN_DIR: block_compviz
      ENABLE_LINTING: "false"

    steps:
      # -----------------------------------------
      # CHECKOUT
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      # -----------------------------------------
      # DETERMINE TAG (unified logic)
      # -----------------------------------------
      - name: Determine tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Using tag: $TAG"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/tags/" ]; then
            echo "Error: No valid tag found"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          
      - name: Checkout exact tag (for manual workflow dispatch)
        if: github.event.inputs.tag != ''
        run: |
          git checkout $TAG

      # -----------------------------------------
      # OPTIONAL LINTING
      # -----------------------------------------
      - name: Set up Node.js
        if: env.ENABLE_LINTING == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: env.ENABLE_LINTING == 'true'
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No package.json found, skipping npm install."
          fi

      - name: Install jq
        if: env.ENABLE_LINTING == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify Grunt availability
        if: env.ENABLE_LINTING == 'true'
        run: |
          if [ ! -f package.json ]; then
            echo "Error: package.json not found. Linting requires a package.json with grunt and its plugins."
            exit 1
          fi
          if ! jq -e '.dependencies.grunt // .devDependencies.grunt' package.json > /dev/null 2>&1; then
            echo "Error: grunt is not listed in package.json. Please add grunt to your devDependencies."
            exit 1
          fi
          if ! npx grunt --help > /dev/null; then
            echo "Error: Grunt is not properly installed. Please ensure grunt and grunt-cli are in your dependencies or devDependencies."
            exit 1
          fi

      - name: Mustache lint
        if: env.ENABLE_LINTING == 'true'
        run: npx grunt mustache

      - name: ESLint
        if: env.ENABLE_LINTING == 'true'
        run: npx grunt eslint

      - name: AMD lint
        if: env.ENABLE_LINTING == 'true'
        run: npx grunt amd

      - name: CSS lint
        if: env.ENABLE_LINTING == 'true'
        run: npx grunt css
      # -----------------------------------------
      # PACKAGE MOODLE PLUGIN
      # -----------------------------------------
      - name: Build plugin archives
        run: |
          set -e
          TAG_NAME="$TAG"
          ARCHIVE_BASENAME="${PLUGIN_DIR}-${TAG_NAME}"

          mkdir -p dist
          mkdir -p "build/${PLUGIN_DIR}"

          rsync -a ./ "build/${PLUGIN_DIR}/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "build" \
            --exclude "dist" \
            --exclude ".gitignore" \
            --exclude ".vscode" \
            --exclude ".editorconfig" \
            --exclude ".idea" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "Gruntfile.js"

          cd build

          zip -r "../dist/${ARCHIVE_BASENAME}.zip" "${PLUGIN_DIR}"
          tar -czf "../dist/${ARCHIVE_BASENAME}.tar.gz" "${PLUGIN_DIR}"

          cd ..
          ls -R dist

      # -----------------------------------------
      # UPLOAD ARTIFACTS
      # -----------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moodle-plugin-${{ env.TAG }}
          path: dist/*

      # -----------------------------------------
      # RELEASE
      # -----------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          files: |
            dist/*.zip
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
